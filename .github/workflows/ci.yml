name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ──────────────────────────────────────────────────────────
  # テスト実行
  #   DB(Pi の PostgreSQL)は CI では立てない。DB 統合テストは
  #   TEST_DATABASE_URL 未設定で graceful skip される(ローカルと同じ挙動)。
  # ──────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          # uv.lock をキャッシュキーに使う(依存が変わったら自動で失効)
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run pytest -v --cov=src

  # ──────────────────────────────────────────────────────────
  # Lint（ruff + mypy strict）
  # ──────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Ruff
        run: uv run ruff check src/ tests/ openwebui/

      - name: Mypy
        run: uv run mypy src/ openwebui/
