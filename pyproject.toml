[project]
name = "catchup-ai"
version = "0.1.0"
description = "AI service for catchup-feed ecosystem - Embedding, RAG, and Article Classification"
readme = "README.md"
authors = [
    { name = "tsuchiya-yu2", email = "yuji2tsuchiya@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    # LLM / Embedding
    "openai>=1.0.0",
    "anthropic>=0.40.0",

    # gRPC
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "grpcio-health-checking>=1.60.0",
    "grpcio-reflection>=1.60.0",

    # Configuration
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]
# Voyage AI support (Anthropic recommended embedding provider)
voyage = [
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catchup_ai"]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Exclude auto-generated code
exclude = [
    "src/catchup_ai/api/grpc/generated/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# Ignore PascalCase method names (required for gRPC servicers)
ignore = ["N802"]

[tool.ruff.lint.per-file-ignores]
# gRPC servicers override methods with PascalCase names
"*_servicer.py" = ["N802"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
