[project]
name = "pulse-ai"
version = "0.1.0"
description = "pulse Phase 2 - transcribe worker + book PDF RAG ingestion (runs on M3 Mac)"
readme = "README.md"
authors = [
    { name = "tsuchiya-yu2", email = "yuji2tsuchiya@gmail.com" }
]
requires-python = ">=3.14"
# Runtime dependencies: only what the code actually imports (§7 依存の刷新).
# pydantic / python-dotenv are NOT declared: pulse code imports neither
# directly (pydantic-settings pulls both transitively).
dependencies = [
    "faster-whisper>=1.2.1",   # local transcription (D-11: large-v3-turbo)
    "psycopg[binary]>=3.3.4",  # Pi PostgreSQL (jobs + books/book_chunks)
    "pydantic-settings>=2.14.2",
    # Book PDF text extraction (P-4). PyMuPDF is AGPL-3.0 — this repository
    # is itself licensed AGPL-3.0 (see LICENSE). Replaced pypdf (BSD):
    # pypdf garbled 80–98% of pages on real Japanese books (embedded-font
    # CID→Unicode mappings it cannot resolve); PyMuPDF extracts them cleanly.
    "pymupdf>=1.28.0",
    "structlog>=26.1.0",
    "yt-dlp>=2026.7.4",        # YouTube subtitles (stage 2) + audio download (stage 3)
]

[project.scripts]
pulse-transcribe = "pulse_transcribe.worker:main"
pulse-books = "pulse_books.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
    "mypy>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse_books", "src/pulse_transcribe"]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true

# Untyped third-party packages (no py.typed / no stubs published).
[[tool.mypy.overrides]]
module = ["yt_dlp", "faster_whisper"]
ignore_missing_imports = true

# pymupdf ships py.typed but most defs are unannotated, which strict mode
# rejects (no-untyped-call). Skip following it so it is treated as Any,
# like the packages above.
[[tool.mypy.overrides]]
module = ["pymupdf"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
