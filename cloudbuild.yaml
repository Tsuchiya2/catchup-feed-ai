# Cloud Build configuration for catchup-ai
# Builds Docker image and deploys to Cloud Run with Tailscale sidecar

substitutions:
  _TAILSCALE_IP: ""  # デプロイ時に --substitutions で指定

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.prod'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/catchup-ai/catchup-ai:$COMMIT_SHA'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/catchup-ai/catchup-ai:latest'
      - '.'

  # Step 2: Push image with commit SHA tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/catchup-ai/catchup-ai:$COMMIT_SHA'

  # Step 3: Push image with latest tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/catchup-ai/catchup-ai:latest'

  # Step 4: Update cloudrun-service.yaml with actual values
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed -i "s|PROJECT_ID|$PROJECT_ID|g" cloudrun-service.yaml
        sed -i "s|TAILSCALE_IP|${_TAILSCALE_IP}|g" cloudrun-service.yaml
        cat cloudrun-service.yaml

  # Step 5: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'services'
      - 'replace'
      - 'cloudrun-service.yaml'
      - '--region'
      - 'asia-northeast1'

  # Step 6: Allow unauthenticated access (public gRPC endpoint)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'services'
      - 'add-iam-policy-binding'
      - 'catchup-ai'
      - '--region'
      - 'asia-northeast1'
      - '--member'
      - 'allUsers'
      - '--role'
      - 'roles/run.invoker'

# Specify images to be pushed
images:
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/catchup-ai/catchup-ai:$COMMIT_SHA'
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/catchup-ai/catchup-ai:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
