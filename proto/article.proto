syntax = "proto3";

package catchup.ai.v1;

option go_package = "github.com/tsuchiya-yu2/catchup-feed-backend/proto/catchup/ai/v1";

// ArticleAI service provides AI-powered features for article processing
service ArticleAI {
  // EmbedArticle generates and stores embedding vector for an article
  rpc EmbedArticle(EmbedArticleRequest) returns (EmbedArticleResponse);

  // SearchSimilar finds articles similar to the given query or article
  rpc SearchSimilar(SearchSimilarRequest) returns (SearchSimilarResponse);

  // QueryArticles performs RAG-based question answering over articles
  rpc QueryArticles(QueryArticlesRequest) returns (QueryArticlesResponse);

  // GenerateWeeklySummary generates a summary of articles for a given period
  rpc GenerateWeeklySummary(GenerateWeeklySummaryRequest) returns (GenerateWeeklySummaryResponse);

  // ClassifyArticle categorizes an article into predefined categories
  rpc ClassifyArticle(ClassifyArticleRequest) returns (ClassifyArticleResponse);
}

// ============================================================================
// EmbedArticle
// ============================================================================

message EmbedArticleRequest {
  // Unique identifier of the article (from catchup-feed-backend)
  int64 article_id = 1;
  // Article title
  string title = 2;
  // Article content (may be truncated for embedding)
  string content = 3;
  // Article URL (optional, for reference)
  string url = 4;
  // Type of content to embed (default: "content")
  // Valid values: "title", "content", "summary"
  string embedding_type = 5;
}

message EmbedArticleResponse {
  // ID of the embedded article
  int64 article_id = 1;
  // Whether the embedding was successful
  bool success = 2;
  // Error message if not successful
  string error_message = 3;
  // Dimension of the embedding vector (e.g., 1536 for text-embedding-3-small)
  int32 embedding_dimension = 4;
  // The generated embedding vector (caller is responsible for storage)
  repeated float embedding = 5;
  // Embedding provider used (e.g., "openai", "voyage")
  string provider = 6;
  // Model name used (e.g., "text-embedding-3-small", "voyage-3")
  string model = 7;
  // Type of content that was embedded (e.g., "title", "content", "summary")
  string embedding_type = 8;
}

// ============================================================================
// SearchSimilar
// ============================================================================

message SearchSimilarRequest {
  // Search by text query
  oneof search_by {
    // Free-text query to search for
    string query = 1;
    // Article ID to find similar articles
    int64 article_id = 2;
  }
  // Maximum number of results to return (default: 10)
  int32 limit = 3;
  // Minimum similarity threshold (0.0 - 1.0, default: 0.5)
  float min_similarity = 4;
}

message SearchSimilarResponse {
  // List of similar articles
  repeated SimilarArticle articles = 1;
}

message SimilarArticle {
  // Article ID
  int64 article_id = 1;
  // Article title
  string title = 2;
  // Article URL
  string url = 3;
  // Cosine similarity score (0.0 - 1.0)
  float similarity_score = 4;
  // Short snippet from the article
  string snippet = 5;
}

// ============================================================================
// QueryArticles (RAG)
// ============================================================================

message QueryArticlesRequest {
  // User's question
  string question = 1;
  // Maximum number of articles to use as context (default: 5)
  int32 max_context_articles = 2;
  // Optional: filter by date range
  DateRange date_range = 3;
  // Optional: filter by category
  repeated string categories = 4;
}

message DateRange {
  // Start date (RFC3339 format)
  string start_date = 1;
  // End date (RFC3339 format)
  string end_date = 2;
}

message QueryArticlesResponse {
  // Generated answer
  string answer = 1;
  // Articles used as context for the answer
  repeated SourceArticle source_articles = 2;
  // Confidence score (0.0 - 1.0)
  float confidence = 3;
}

message SourceArticle {
  // Article ID
  int64 article_id = 1;
  // Article title
  string title = 2;
  // Article URL
  string url = 3;
  // Relevance score
  float relevance_score = 4;
}

// ============================================================================
// GenerateWeeklySummary
// ============================================================================

message GenerateWeeklySummaryRequest {
  // Period for summary (e.g., "week", "month")
  string period = 1;
  // Optional: specific date range
  DateRange date_range = 2;
  // Optional: filter by topic/category
  repeated string topics = 3;
  // Maximum length of summary (in characters)
  int32 max_length = 4;
}

message GenerateWeeklySummaryResponse {
  // Generated summary
  string summary = 1;
  // Key highlights
  repeated string highlights = 2;
  // Articles included in the summary
  repeated SummaryArticle articles = 3;
  // Period covered
  DateRange covered_period = 4;
}

message SummaryArticle {
  int64 article_id = 1;
  string title = 2;
  string url = 3;
  string category = 4;
}

// ============================================================================
// ClassifyArticle
// ============================================================================

message ClassifyArticleRequest {
  // Article ID (optional, if already stored)
  int64 article_id = 1;
  // Article title
  string title = 2;
  // Article content
  string content = 3;
}

message ClassifyArticleResponse {
  // Primary category
  string category = 1;
  // Confidence score for primary category (0.0 - 1.0)
  float confidence = 2;
  // All category scores
  repeated CategoryScore all_scores = 3;
}

message CategoryScore {
  // Category name (e.g., "AI", "Web", "Infrastructure", "Security")
  string category = 1;
  // Confidence score
  float score = 2;
}
