# Docker Compose for local development
# Usage: docker compose up -d
#
# Architecture note:
#   catchup-ai is a pure AI service (embedding generation, RAG).
#   Database operations are handled by catchup-feed-backend (Go service).

services:
  # catchup-ai gRPC server
  catchup-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catchup-ai
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      # Embedding provider (openai or voyage)
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      # gRPC server
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50051
      # Backend connection (for SearchSimilar)
      - BACKEND_GRPC_HOST=${BACKEND_GRPC_HOST:-host.docker.internal}
      - BACKEND_GRPC_PORT=${BACKEND_GRPC_PORT:-50052}
    ports:
      - "50051:50051"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
